<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" role="img" aria-labelledby="title desc">
<title id="title">Khuyến nghị xe đến trạm sạc dựa trên quan sát phân tán</title>
<desc id="desc">Một flowchart nằm ngang: xe cần sạc, lọc trạm có thể đến, dự báo tại từng trạm, Pareto–Minimax, khuyến nghị, xe tự quyết định, di chuyển và đến trạm sạc. Trạng thái vật lý và lịch sử xe thực sự đến cung cấp dữ liệu cho dự báo. Hiệu chỉnh học từ trạm lân cận là tùy chọn. Xe có thể chưa chọn và chờ khuyến nghị sau. Khuyến nghị không giữ chỗ.</desc>
<defs>
<marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#76859B"/></marker>
