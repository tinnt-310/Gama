<symbol id="charger" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"><rect x="10" y="6" width="24" height="36" rx="3"/><path d="M34 13 H39 V33 A3 3 0 0 1 33 33 M24 17 L17 27 H26 L20 36 M15 12 H29"/></g></symbol>
