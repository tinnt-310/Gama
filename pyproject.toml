[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ranr-research"
version = "0.3.0"
description = "Reproducible decentralized EV charging recommendation research"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "cma==4.4.4", "matplotlib==3.10.7"]

[project.scripts]
ranr = "ranr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
